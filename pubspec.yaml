name: beat_timer
description: "Workout timer app for Tabata and custom rounds"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  audioplayers: ^6.1.0
  vibration: ^3.2.1
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^23.0.1
  wakelock_plus: ^1.8.2
  purchases_flutter: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/beat-timer-icon.png"
  adaptive_icon_background: "#1E293B"
  adaptive_icon_foreground: "assets/images/beat-timer-icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/images/
